plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicehome'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.example.voicehome'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Версия из методички; HTTP используется для сервера в локальной сети.
    implementation 'com.squareup.okhttp3:okhttp:3.6.0'
}
