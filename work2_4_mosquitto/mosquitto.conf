# Добавить эти 2 строки в /etc/mosquitto/mosquitto.conf на малине-брокере.
# С версии 2 Mosquitto по умолчанию слушает только localhost и требует
# аутентификацию — без них клиенты (Arduino, Android) не подключатся.
#
# ВНИМАНИЕ: в методичке опечатка — путь указан как /etc/mosquito/mosquito.conf,
# правильный путь: /etc/mosquitto/mosquitto.conf

listener 1883
allow_anonymous true
