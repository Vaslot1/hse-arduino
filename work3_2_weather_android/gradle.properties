org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3 официально тестировался до compileSdk 35, у нас platform-36
android.suppressUnsupportedCompileSdk=36
# Загадочная строка из методички: без неё приложение запускается,
# но ничего не показывает (paho 1.1.1 использует support-библиотеки,
# jetifier переписывает их на androidx.localbroadcastmanager)
android.enableJetifier=true
