plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.weatherstation'
    // в SDK установлена только platform-36 (dl.google.com недоступен,
    // platform-35 не скачать)
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.example.weatherstation"
        minSdk 24
        // targetSdk именно 30 (по методичке): paho 1.1.1 давно не обновлялась
        // и не имеет кода для API 31+ (exported-флаги, PendingIntent)
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }
}

// coroutines 1.6.4 (из appcompat) тянут kotlin-stdlib-jdk8/jdk7 1.6.21,
// которые дублируют классы kotlin-stdlib 1.8.22 -> исключаем старые
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // MQTT-клиент Eclipse Paho (зависимости из методички)
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    // Update 06.02.2026 из методички
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'

    // Работа 3: HTTP-клиент для ThingSpeak REST API
    implementation 'com.android.volley:volley:1.2.1'
}
